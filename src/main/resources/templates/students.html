<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>학생 목록</title>
</head>
<body>
<h1>학생 목록</h1>
<form th:action="@{/students}" method="get">
    <input type="text" name="nameKeyword"
           th:value="${nameKeyword}" placeholder="학생 이름">
    <input type="text" name="majorKeyword"
           th:value="${majorKeyword}" placeholder="학과">
    <select name="sortField">
        <option value="id" th:selected="${sortField == 'id'}">ID</option>
        <option value="name" th:selected="${sortField == 'name'}">이름</option>
        <option value="major" th:selected="${sortField == 'major'}">학과</option>
        <option value="grade" th:selected="${sortField == 'grade'}">학년</option>
    </select>
    <select name="sortDir">
        <option value="asc" th:selected="${sortDir == 'asc'}">오름차순</option>
        <option value="desc" th:selected="${sortDir == 'desc'}">내림차순</option>
    </select>
    <input type="hidden" name="page" value="0">
    <input type="hidden" name="size" th:value="${size}">
    <button type="submit">검색</button>
</form>
<table border="1">
    <thead>
    <p>총 <span th:text="${students.size()}"></span>명
    </p>
    <tr>
        <th>ID</th>
        <th>이름</th>
        <th>학과</th>
        <th>학년</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="student : ${students}">
        <td th:text="${student.id}">1</td>
        <td>
            <a th:href="@{/students/{id}(id=${student.id})}"
               th:text="${student.name}">
            </a>
        </td>
        <td th:text="${student.major}"></td>
        <td th:text="${student.grade}"></td>
        <td>
            <a th:href="@{/students/{id}/edit(id=${student.id})}">수정</a>

            <form th:action="@{/students/{id}/delete(id=${student.id})}"
                  method="post"
                  style="display:inline;">
                <button type="submit">삭제</button>
            </form>
    </tr>
    </tbody>
</table>
<div th:if="${totalPages > 0}">
    <a th:if="${currentPage > 0}"
       th:href="@{/students(
        page=${currentPage - 1},
        size=${size},
        nameKeyword=${nameKeyword},
        majorKeyword=${majorKeyword},
        sortField=${sortField},
        sortDir=${sortDir})}">이전</a>
    <span th:each="pageNumber :
${#numbers.sequence(0, totalPages - 1)}">
<strong th:if="${pageNumber == currentPage}"
        th:text="${pageNumber + 1}">1</strong>
<a th:if="${pageNumber != currentPage}"
   th:href="@{/students(
   page=${pageNumber},
   size=${size},
   nameKeyword=${nameKeyword},
   majorKeyword=${majorKeyword},
   sortField=${sortField},
   sortDir=${sortDir})}"
   th:text="${pageNumber + 1}">1</a>
</span>
    <a th:if="${currentPage < totalPages - 1}"
       th:href="@{/students(
       page=${currentPage + 1},
       size=${size},
       nameKeyword=${nameKeyword},
       majorKeyword=${majorKeyword},
       sortField=${sortField},
       sortDir=${sortDir})}">다음</a>
</div>

<p><a th:href="@{/student-form}">학생 등록하기</a></p>
</body>
</html>
