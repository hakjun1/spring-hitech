<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>학생 상세정보</title>
</head>
<body>
<h1>학생 상세정보</h1>
<p>ID: <span th:text="${student.id}">1</span></p>
<p>이름: <span th:text="${student.name}">홍길동</span></p>
<p>학과: <span th:text="${student.major}">소프트웨어융합과</span></p>
<p>학년: <span th:text="${student.grade}">2</span></p>

<p>
    <a th:href="@{/students/{id}/edit(id=${student.id})}">수정</a>
</p>

<form th:action="@{/students/{id}/delete(id=${student.id})}"
      method="post">
    <button type="submit">삭제</button>
</form>


<p><a th:href="@{/students}">학생 목록으로 돌아가기</a></p>
</body>
</html>
