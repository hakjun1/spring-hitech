<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>학생 정보 수정</title>
</head>
<body>
<h1>학생 정보 수정</h1>
<form th:action="@{/students/{id}/edit(id=${student.id})}"
      th:object="${student}"
      method="post">
    <p>
        <label for="name">이름:</label>
        <input type="text" id="name" th:field="*{name}">
        <span th:if="${#fields.hasErrors('name')}"
              th:errors="*{name}">이름 오류</span>
    </p>
    <p>
        <label for="major">학과:</label>
        <input type="text" id="major" th:field="*{major}">
        <span th:if="${#fields.hasErrors('major')}"
              th:errors="*{major}">학과 오류</span>
    </p>
    <p>
        <label for="grade">학년:</label>
        <input type="number" id="grade" th:field="*{grade}">
        <span th:if="${#fields.hasErrors('grade')}"
              th:errors="*{grade}">학년 오류</span>
    </p>
    <button type="submit">수정</button>
</form>
<p><a th:href="@{/students}">학생 목록으로 돌아가기</a></p>
</body>
</html>
